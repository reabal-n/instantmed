name: Hosted Stripe Guest Checkout E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-stripe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HOSTED_STRIPE_E2E_STRIPE_SECRET_KEY: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_SECRET_KEY }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_MEDCERT: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_MEDCERT }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_MEDCERT_2DAY: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_MEDCERT_2DAY }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_MEDCERT_3DAY: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_MEDCERT_3DAY }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_REPEAT_SCRIPT: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_REPEAT_SCRIPT }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_ED: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_ED }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_HAIR_LOSS: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_HAIR_LOSS }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_WOMENS_HEALTH: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_WOMENS_HEALTH }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_WEIGHT_LOSS: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_CONSULT_WEIGHT_LOSS }}
      HOSTED_STRIPE_E2E_STRIPE_PRICE_PRIORITY_FEE: ${{ secrets.HOSTED_STRIPE_E2E_STRIPE_PRICE_PRIORITY_FEE }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.102.0

      - name: Install pinned Stripe CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/stripe.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/stripe/stripe-cli/releases/download/v1.50.10/stripe_1.50.10_linux_x86_64.tar.gz" \
            --output "${archive}"
          echo "de57a83f97c813bb2440d06db4345a2361e57dd684198452cd121e9f22479b38  ${archive}" | sha256sum --check --status
          stripe_dir="${RUNNER_TEMP}/stripe-cli"
          mkdir -p "${stripe_dir}"
          tar -xzf "${archive}" -C "${stripe_dir}"
          chmod 0755 "${stripe_dir}/stripe"
          echo "${stripe_dir}" >> "${GITHUB_PATH}"

      - name: Run the isolated hosted Stripe journey
        run: corepack pnpm e2e:stripe-hosted

      - name: Upload PHI-free receipt
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-stripe-e2e-receipt
          path: .artifacts/hosted-stripe-e2e/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hosted-stripe-e2e-diagnostics
          path: test-results/hosted-stripe/
          if-no-files-found: ignore
          retention-days: 7
